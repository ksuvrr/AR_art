<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Мыслеформы: ветви вероятности</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root { --ui: #fff; --font: 'Montserrat', 'Helvetica Neue', Arial, sans-serif; }
    /* фон только у html — иначе закроет камеру */
    html { height: 100%; background: #000; }
    body { margin: 0; height: 100%; font-family: var(--font); font-weight: 300; }

    /* Экраны 1 и 2: белые */
    .screen {
      position: fixed; inset: 0; z-index: 10; background: #fff; color: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 24px; transition: opacity .6s;
    }
    .screen.off { opacity: 0; pointer-events: none; }
    #start { padding: 0; background: #f8f8f8 url('./bg_start.jpg') center / 100% auto no-repeat; }
    #startBtn { position: absolute; background: none; border: 0; padding: 0; opacity: 0;
                cursor: pointer; -webkit-tap-highlight-color: transparent; }
    /* запасной вариант, если bg_start.jpg не загрузился: видна обычная кнопка */
    #start.nobg #startBtn { position: static; width: auto; height: auto; opacity: 1; color: #000;
      font: 300 18px var(--font); border: 1px solid #000; border-radius: 20px; padding: 6px 28px; }
    #start.nobg #startBtn::after { content: 'начать'; }
    #hint .big   { font-size: 24px; margin: 0; }
    #hint .line  { width: 1px; height: 26px; background: #000; margin: 14px 0; }
    #hint .small { font-size: 15px; font-weight: 400; line-height: 1.3; max-width: 240px; margin: 0; }

    /* Экраны 3-6: интерфейс поверх камеры */
    #hud { position: fixed; inset: 0; z-index: 5; pointer-events: none; color: var(--ui);
           opacity: 0; transition: opacity .6s; }
    #hud.on { opacity: 1; }
    #frame { position: absolute; left: 50%; top: 50%; width: min(52vw, 240px); aspect-ratio: 1;
             transform: translate(-50%, -50%); filter: drop-shadow(0 0 3px rgba(0,0,0,.6)); }
    #frame i { position: absolute; width: 20%; height: 20%; border: 0 solid var(--ui); }
    #frame i:nth-child(1) { left: 0;  top: 0;    border-width: 1px 0 0 1px; }
    #frame i:nth-child(2) { right: 0; top: 0;    border-width: 1px 1px 0 0; }
    #frame i:nth-child(3) { left: 0;  bottom: 0; border-width: 0 0 1px 1px; }
    #frame i:nth-child(4) { right: 0; bottom: 0; border-width: 0 1px 1px 0; }

    .msg { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
           text-align: center; font-size: 22px; line-height: 1.25; opacity: 0; transition: opacity .5s;
           text-shadow: 0 0 8px rgba(0,0,0,.65); }
    .msg.show { opacity: 1; }
    #wait { width: min(52vw, 240px); left: 50%; right: auto; margin-left: calc(min(52vw, 240px) / -2); }

    #dots { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 10px;
            bottom: calc(28px + env(safe-area-inset-bottom, 0px)); filter: drop-shadow(0 0 3px rgba(0,0,0,.6)); }
    .d { width: 12px; height: 12px; box-sizing: border-box; border: 1px solid var(--ui); border-radius: 50%; }
    .d.full { background: var(--ui); }
  </style>
</head>
<body>

  <!-- Экран 1: старт -->
  <div id="start" class="screen">
    <button id="startBtn" aria-label="начать"></button>
  </div>

  <!-- Экран 2: подсказка (появляется вместе с запросом доступа к камере) -->
  <div id="hint" class="screen off">
    <p class="big">Прояви мысли</p>
    <div class="line"></div>
    <p class="small">наведи камеру телефона<br>на картину</p>
    <p class="small" id="hintErr" style="margin-top:20px"></p>
  </div>

  <!-- Экраны 3-6: интерфейс на время поиска -->
  <div id="hud">
    <div id="frame"><i></i><i></i><i></i><i></i></div>
    <div id="wait" class="msg">Мысль еще<br>формируется</div>
    <div id="say" class="msg"></div>
    <div id="dots"></div>
  </div>

  <!-- Сцена создаётся скриптом, чтобы можно было подбирать сглаживание прямо в адресе:
       .../AR_art/?cf=0.00001&beta=100   (без параметров работают значения по умолчанию ниже) -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var cf = q.get('cf') || '0.0001', beta = q.get('beta') || '1000';
      document.write('<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: no; uiLoading: no; uiError: no; filterMinCF: ' + cf + '; filterBeta: ' + beta + ';" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" color-space="sRGB" renderer="colorManagement: true"><a-camera position="0 0 0" look-controls="enabled: false"></a-camera></a-scene>');
    })();
  </script>

  <script>
    /* ===== НАСТРОЙКИ ===== */
    const GOAL = 4;           // сколько картин нужно собрать
    const FADE_MS = 800;      // плавное появление видео
    const WAIT_DELAY = 3000;  // через сколько мс поиска показать «Мысль еще формируется»
    const SAY_MS = 2200;      // сколько висит «Мысль проявлена»
    const FINAL_MS = 4000;    // сколько висит «Все мысли проявлены!»
    const HINT_MIN_MS = 2500; // минимум времени показа подсказки

    /* Картины В ТОМ ПОРЯДКЕ, в каком они в targets.mind (первая = 0).
       video — файл ролика
       w     — какую долю ширины таргета занимает картина (1 = вся; для картины
               в квадратной версии с серыми полями поставьте 0.683)
       shape — 'rect' (прямоугольник) или 'circle' (круг, видео должно быть квадратным) */
    const PAINTINGS = [
      { video: './01_loop.mp4', w: 1,     shape: 'circle' },
      { video: './02_loop.mp4', w: 1,     shape: 'circle' },
      { video: './03_loop.mp4', w: 1,     shape: 'rect'   },
      { video: './04_loop.mp4', w: 1,     shape: 'rect'   },
    ];
    /* ===================== */

    const $ = id => document.getElementById(id);
    const scene = document.querySelector('a-scene');
    const videos = [], planes = [], fades = {}, found = new Set();
    let visible = 0, sayOn = false, waitT, sayT;

    function fadeTo(i, to, ms) {
      const mesh = planes[i].getObject3D('mesh');
      if (!mesh) return;
      const mat = mesh.material; mat.transparent = true;
      cancelAnimationFrame(fades[i]);
      if (!ms) { mat.opacity = to; return; }
      const from = mat.opacity, t0 = performance.now();
      const step = now => {
        const k = Math.min(1, (now - t0) / ms);
        mat.opacity = from + (to - from) * k;
        if (k < 1) fades[i] = requestAnimationFrame(step);
      };
      fades[i] = requestAnimationFrame(step);
    }

    function renderDots() {
      $('dots').innerHTML = Array.from({ length: GOAL }, (_, k) =>
        '<span class="d' + (k < found.size ? ' full' : '') + '"></span>').join('');
    }
    function setWait(on) {
      clearTimeout(waitT);
      $('wait').classList.toggle('show', false);
      if (on) waitT = setTimeout(() => { if (!visible && !sayOn) $('wait').classList.add('show'); }, WAIT_DELAY);
    }
    function say(text, ms) {
      clearTimeout(sayT); sayOn = true;
      $('say').innerHTML = text; $('say').classList.add('show');
      setWait(false);
      sayT = setTimeout(() => {
        $('say').classList.remove('show'); sayOn = false;
        if (!visible) setWait(true);
      }, ms);
    }

    /* Создаём видео и якоря для каждой картины */
    PAINTINGS.forEach((p, i) => {
      const v = document.createElement('video');
      v.id = 'video' + i; v.src = p.video; v.loop = true; v.preload = 'auto';
      v.crossOrigin = 'anonymous'; v.style.display = 'none';
      v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
      document.body.appendChild(v); videos.push(v);

      const target = document.createElement('a-entity');
      target.setAttribute('mindar-image-target', 'targetIndex: ' + i);
      const pl = document.createElement(p.shape === 'circle' ? 'a-circle' : 'a-plane');
      pl.setAttribute('material', 'shader: flat; src: #video' + i);
      target.appendChild(pl); scene.appendChild(target); planes.push(pl);

      // подгоняем пропорции плоскости под пропорции видео
      const fit = () => {
        if (!v.videoWidth) return;
        if (p.shape === 'circle') pl.setAttribute('radius', p.w / 2);
        else { pl.setAttribute('width', p.w); pl.setAttribute('height', p.w * v.videoHeight / v.videoWidth); }
      };
      v.addEventListener('loadedmetadata', fit);

      target.addEventListener('targetFound', () => {
        visible++; fit(); setWait(false);
        fadeTo(i, 0, 0); v.play(); fadeTo(i, 1, FADE_MS);
        if (!found.has(i)) {
          found.add(i); renderDots();
          if (found.size >= GOAL) say('Все мысли<br>проявлены!', FINAL_MS);
          else say('Мысль проявлена', SAY_MS);
        }
      });
      target.addEventListener('targetLost', () => {
        visible = Math.max(0, visible - 1);
        fadeTo(i, 0, 0); v.pause();
        if (!visible && !sayOn) setWait(true);
      });
    });
    renderDots();

    /* Невидимая кнопка ставится ровно поверх нарисованной кнопки «начать» на картинке */
    const BG = { w: 1117, h: 2428 };                    // размер bg_start.jpg
    const BTN = { x: 400, y: 1858, w: 407, h: 97 };     // где кнопка на картинке
    function placeStart() {
      if ($('start').classList.contains('nobg')) return;
      const k = innerWidth / BG.w, top = (innerHeight - BG.h * k) / 2;
      Object.assign($('startBtn').style, {
        left: BTN.x * k + 'px', top: top + BTN.y * k + 'px', width: BTN.w * k + 'px', height: BTN.h * k + 'px' });
    }
    placeStart(); addEventListener('resize', placeStart);
    const bgTest = new Image();
    bgTest.onerror = () => { $('start').classList.add('nobg'); $('startBtn').removeAttribute('style'); };
    bgTest.src = './bg_start.jpg';

    /* Кнопка «начать» */
    $('startBtn').addEventListener('click', () => {
      videos.forEach(v => v.play().then(() => v.pause()).catch(() => {})); // разрешаем видео на iOS
      $('start').classList.add('off');
      $('hint').classList.remove('off');
      const t0 = Date.now();
      const go = async () => {
        try {
          await scene.systems['mindar-image-system'].start();
          setTimeout(() => {
            $('hint').classList.add('off');
            $('hud').classList.add('on');
            setWait(true);
          }, Math.max(0, HINT_MIN_MS - (Date.now() - t0)));
        } catch (e) {
          $('hintErr').textContent = 'Не удалось включить камеру. Разрешите доступ в настройках браузера.';
        }
      };
      scene.hasLoaded ? go() : scene.addEventListener('loaded', go);
    });
  </script>
</body>
</html>
